openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Authenticated session operations
  - name: organizations
    description: Organization and workspace operations
  - name: dashboard
    description: Dashboard summaries
  - name: modules
    description: Platform module registry and organization entitlements
  - name: catalog
    description: Products and services catalog
  - name: quotations
    description: Sales quotations and price estimates
  - name: invoices
    description: Sales invoices and ZATCA Phase 1 E-Invoicing
  - name: purchase-bills
    description: Vendor purchase bills and supplier invoices
  - name: expenses
    description: Daily business operational expenses
  - name: accounting
    description: Chart of Accounts and Trial Balance
  - name: journal-entries
    description: Manual Double-Entry Journal Vouchers
  - name: reports
    description: Financial Statements and ZATCA VAT Return Reports
  - name: dashboard
    description: Realtime Executive Dashboard Analytics
  - name: audit-logs
    description: System Audit Log Trail and Activity Governance

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentSession
      tags: [session]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          description: Unauthorized
  /me/preferences:
    patch:
      operationId: updateUserPreferences
      tags: [session]
      summary: Update the current user's workspace preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesInput"
      responses:
        "200":
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          description: Invalid preferences
        "401":
          description: Unauthorized
  /organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid organization data
        "401":
          description: Unauthorized
  /organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get an organization the current user belongs to
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Organization access denied
        "404":
          description: Organization not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid organization data
        "403":
          description: Organization access denied
        "404":
          description: Organization not found
  /organizations/{organizationId}/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get an empty-safe dashboard summary
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "403":
          description: Organization access denied
        "404":
          description: Organization not found
  /organizations/{organizationId}/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [organizations]
      summary: List recent organization audit logs
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: Organization access denied
  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List the platform module registry
      responses:
        "200":
          description: Platform modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleDefinition"
  /organizations/{organizationId}/modules:
    get:
      operationId: listOrganizationModules
      tags: [modules]
      summary: List module entitlements for an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization module entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationModule"
        "403":
          description: Organization access denied
  /organizations/{organizationId}/customers:
    get:
      operationId: getCustomers
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartySearch"
        - $ref: "#/components/parameters/PartyPage"
        - $ref: "#/components/parameters/PartyPageSize"
        - $ref: "#/components/parameters/PartySort"
        - $ref: "#/components/parameters/PartyStatus"
        - $ref: "#/components/parameters/PartyType"
        - $ref: "#/components/parameters/PartyVatRegistered"
        - $ref: "#/components/parameters/PartyCity"
        - $ref: "#/components/parameters/PartyTag"
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyListResponse"
    post:
      operationId: createCustomer
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyCreateInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
  /organizations/{organizationId}/suppliers:
    get:
      operationId: getSuppliers
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartySearch"
        - $ref: "#/components/parameters/PartyPage"
        - $ref: "#/components/parameters/PartyPageSize"
        - $ref: "#/components/parameters/PartySort"
        - $ref: "#/components/parameters/PartyStatus"
        - $ref: "#/components/parameters/PartyType"
        - $ref: "#/components/parameters/PartyVatRegistered"
        - $ref: "#/components/parameters/PartyCity"
        - $ref: "#/components/parameters/PartyTag"
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyListResponse"
    post:
      operationId: createSupplier
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyCreateInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
  /organizations/{organizationId}/customers/{partyId}:
    get:
      operationId: getCustomer
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
    patch:
      operationId: updateCustomer
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyUpdateInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
  /organizations/{organizationId}/suppliers/{partyId}:
    get:
      operationId: getSupplier
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Supplier detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
    patch:
      operationId: updateSupplier
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyUpdateInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
  /organizations/{organizationId}/parties/{partyId}/status:
    patch:
      operationId: updatePartyStatus
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyStatusInput"
      responses:
        "200":
          description: Updated party status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyDetail"
  /organizations/{organizationId}/parties/{partyId}/roles/{role}:
    post:
      operationId: addPartyRole
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [customer, supplier]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyRoleInput"
      responses:
        "201":
          description: Added party role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyRole"
  /organizations/{organizationId}/parties/{partyId}/duplicates:
    post:
      operationId: checkPartyDuplicates
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyDuplicateInput"
      responses:
        "200":
          description: Duplicate warnings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateWarning"
  /organizations/{organizationId}/parties/{partyId}/contacts:
    get:
      operationId: listPartyContacts
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyContact"
    post:
      operationId: createPartyContact
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyContactInput"
      responses:
        "201":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyContact"
  /organizations/{organizationId}/parties/{partyId}/contacts/{contactId}:
    patch:
      operationId: updatePartyContact
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyContactInput"
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyContact"
    delete:
      operationId: deletePartyContact
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Deleted
  /organizations/{organizationId}/parties/{partyId}/addresses:
    get:
      operationId: listPartyAddresses
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyAddress"
    post:
      operationId: createPartyAddress
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyAddressInput"
      responses:
        "201":
          description: Address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyAddress"
  /organizations/{organizationId}/parties/{partyId}/addresses/{addressId}:
    patch:
      operationId: updatePartyAddress
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyAddressInput"
      responses:
        "200":
          description: Address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyAddress"
    delete:
      operationId: deletePartyAddress
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - $ref: "#/components/parameters/AddressId"
      responses:
        "204":
          description: Deleted
  /organizations/{organizationId}/tags:
    get:
      operationId: listPartyTags
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyTag"
    post:
      operationId: createPartyTag
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyTagInput"
      responses:
        "201":
          description: Tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyTag"
  /organizations/{organizationId}/parties/{partyId}/tags/{tagId}:
    put:
      operationId: assignPartyTag
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Assigned
    delete:
      operationId: removePartyTag
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
  /organizations/{organizationId}/party-search:
    get:
      operationId: findParties
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Party search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyListItem"
  /organizations/{organizationId}/{role}/import/template:
    get:
      operationId: downloadPartyImportTemplate
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyRolePath"
      responses:
        "200":
          description: CSV template
          content:
            text/csv: { schema: { type: string } }
  /organizations/{organizationId}/{role}/import/preview:
    post:
      operationId: previewPartyImport
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyRolePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyImportInput" }
      responses:
        "200":
          description: Import validation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyImportPreview" }
  /organizations/{organizationId}/{role}/import/confirm:
    post:
      operationId: confirmPartyImport
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyRolePath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyImportInput" }
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyImportResult" }
  /organizations/{organizationId}/{role}/export:
    get:
      operationId: exportParties
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyRolePath"
        - $ref: "#/components/parameters/PartySearch"
        - $ref: "#/components/parameters/PartyStatus"
      responses:
        "200":
          description: CSV export
          content:
            text/csv: { schema: { type: string } }
  /storage/uploads/request-url:
    post:
      operationId: requestStorageUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlInput" }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }
  /storage/objects/{objectPath}:
    get:
      operationId: downloadStorageObject
      tags: [storage]
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Object bytes }
  /organizations/{organizationId}/parties/{partyId}/documents/{documentId}/download:
    get:
      operationId: downloadPartyDocument
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Document bytes }
  /organizations/{organizationId}/parties/{partyId}/documents:
    get:
      operationId: listPartyDocuments
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Party documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartyDocument" }
    post:
      operationId: createPartyDocument
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyDocumentInput" }
      responses:
        "201":
          description: Registered document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyDocument" }
  /organizations/{organizationId}/parties/{partyId}/documents/{documentId}:
    patch:
      operationId: updatePartyDocument
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyDocumentUpdateInput" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyDocument" }
    delete:
      operationId: deletePartyDocument
      tags: [parties]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PartyId"
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Document removed }
  /organizations/{organizationId}/catalog/items:
    get:
      operationId: listCatalogItems
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/CatalogItemType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CatalogItemStatus" } }
        - { name: taxCategory, in: query, schema: { $ref: "#/components/schemas/TaxCategory" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, code, created, updated], default: name } }
      responses:
        "200": { description: Catalog items, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogListResponse" } } } }
    post:
      operationId: createCatalogItem
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItemInput" } } } }
      responses:
        "201": { description: Created item, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
  /organizations/{organizationId}/catalog/items/{itemId}:
    get:
      operationId: getCatalogItem
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/CatalogItemId" }]
      responses:
        "200": { description: Item, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
    patch:
      operationId: updateCatalogItem
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/CatalogItemId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItemUpdate" } } } }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
  /organizations/{organizationId}/catalog/items/{itemId}/status:
    patch:
      operationId: updateCatalogItemStatus
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/CatalogItemId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItemStatusInput" } } } }
      responses:
        "200": { description: Updated status, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogItem" } } } }
  /organizations/{organizationId}/catalog/units:
    get:
      operationId: listCatalogUnits
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200": { description: Units, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CatalogUnit" } } } } }
