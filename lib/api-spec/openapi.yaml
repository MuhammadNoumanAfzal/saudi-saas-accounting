components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JournalEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }

    BillId:
      name: billId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuotationId:
      name: quotationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CatalogItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartyId:
      name: partyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartySearch:
      name: search
      in: query
      schema: { type: string }
    PartyPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PartyPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PartySort:
      name: sort
      in: query
      schema: { type: string, enum: [name, number, created, updated], default: name }
    PartyStatus:
      name: status
      in: query
      schema: { type: string, enum: [active, inactive] }
    PartyType:
      name: partyType
      in: query
      schema: { type: string, enum: [organization, individual] }
    PartyVatRegistered:
      name: vatRegistered
      in: query
      schema: { type: boolean }
    PartyCity:
      name: city
      in: query
      schema: { type: string }
    PartyTag:
      name: tagId
      in: query
      schema: { type: string, format: uuid }
    PartyRolePath:
      name: role
      in: path
      required: true
      schema: { type: string, enum: [customers, suppliers] }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    Organization:
      type: object
      required:
        - id
        - legalNameEnglish
        - country
        - currency
        - timezone
        - defaultLanguage
        - vatRegistered
      properties:
        id:
          type: string
          format: uuid
        legalNameEnglish:
          type: string
        legalNameArabic:
          type: ["string", "null"]
        tradingNameEnglish:
          type: ["string", "null"]
        tradingNameArabic:
          type: ["string", "null"]
        businessType:
          type: ["string", "null"]
          enum:
            - establishment
            - limited_liability_company
            - joint_stock_company
            - professional_company
            - non_profit
            - other
            - null
        vatNumber:
          type: ["string", "null"]
        commercialRegistrationNumber:
          type: ["string", "null"]
        country:
          type: string
        city:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        streetName:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        additionalNumber:
          type: ["string", "null"]
        buildingNumber:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        currency:
          type: string
        fiscalYearStart:
          type: string
        defaultLanguage:
          type: string
          enum: [en, ar]
        timezone:
          type: string
        vatRegistered:
          type: boolean
        numberFormat:
          type: string
          enum: [western, arabic]
        invoiceLanguage:
          type: string
          enum: [en, ar, bilingual]
        onboardingCompleted:
          type: boolean
        onboardingCurrentStep:
          type: integer
          minimum: 1
          maximum: 5
        createdAt:
          type: string
          format: date-time
    OrganizationInput:
      type: object
      required: [legalNameEnglish]
      properties:
        legalNameEnglish:
          type: string
          minLength: 1
        legalNameArabic:
          type: ["string", "null"]
        tradingNameEnglish:
          type: ["string", "null"]
        tradingNameArabic:
          type: ["string", "null"]
        businessType:
          type: ["string", "null"]
          enum:
            - establishment
            - limited_liability_company
            - joint_stock_company
            - professional_company
            - non_profit
            - other
            - null
        vatNumber:
          type: ["string", "null"]
        commercialRegistrationNumber:
          type: ["string", "null"]
        country:
          type: string
          default: Saudi Arabia
        city:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        streetName:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        additionalNumber:
          type: ["string", "null"]
        buildingNumber:
          type: ["string", "null"]
        district:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        currency:
          type: string
          default: SAR
        fiscalYearStart:
          type: string
          default: "01-01"
        defaultLanguage:
          type: string
          enum: [en, ar]
          default: en
        timezone:
          type: string
          default: Asia/Riyadh
        vatRegistered:
          type: boolean
          default: false
        numberFormat:
          type: string
          enum: [western, arabic]
          default: western
        invoiceLanguage:
          type: string
          enum: [en, ar, bilingual]
          default: bilingual
        onboardingCompleted:
          type: boolean
          default: false
        onboardingCurrentStep:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
    OrganizationUpdate:
      allOf:
        - $ref: "#/components/schemas/OrganizationInput"
    OrganizationMembership:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          type: string
          enum: [owner, admin, accountant, sales, purchasing, viewer]
    CurrentSession:
      type: object
      required: [user, organizations, preferences]
